version: 2

models:
  - name: stg_orders
    description: "Staged orders with enriched fields"
    columns:
      - name: order_id
        description: "Unique order identifier"
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              values: ['delivered', 'delayed', 'cancelled']
      - name: delivery_time_min
        data_tests:
          - not_null

  - name: stg_captains
    description: "Staged captains with performance tier"
    columns:
      - name: captain_id
        data_tests:
          - unique
          - not_null

  - name: stg_restaurants
    description: "Staged restaurants with prep speed tier"
    columns:
      - name: restaurant_id
        data_tests:
          - unique
          - not_null